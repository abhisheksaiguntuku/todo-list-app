
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 40px;
        }

        .container {
            max-width: 400px;
            margin: 40px auto;
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        h1 {
            text-align: center;
            color: green;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: orange;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <p>Organize your daily tasks!</p>

        <input type="text" id="taskInput" placeholder="Enter a task">

	<button id="addButton">Add Task</button>
	<p id="taskCounter">Total: 0 | Completed: 0</p>

	<div class="filters">
    		<button id="allButton">All</button>
    		<button id="activeButton">Active</button>
    		<button id="completedButton">Completed</button>
	</div>
	<ul id="taskList"></ul>
    </div>
    
 

<script>
    const taskInput = document.getElementById("taskInput");
    const addButton = document.getElementById("addButton");
    const taskList = document.getElementById("taskList");

    // Load previously saved tasks
    let tasks = JSON.parse(localStorage.getItem("myTasks")) || [];
    let currentFilter = "all";

    const taskCounter = document.getElementById("taskCounter");
    const allButton = document.getElementById("allButton");
    const activeButton = document.getElementById("activeButton");
    const completedButton = document.getElementById("completedButton");

    // Save tasks in the browser
    function saveTasks() {
        localStorage.setItem("myTasks", JSON.stringify(tasks));
    }

    // Display all tasks
    function renderTasks() {
        taskList.innerHTML = "";
	const completedCount = tasks.filter(
    	function (task) {
        	return task.completed;
    	}
	).length;

	taskCounter.textContent =
    	`Total: ${tasks.length} | Completed: ${completedCount}`;

	const filteredTasks = tasks.filter(function (task) {
    	if (currentFilter === "active") {
        	return !task.completed;
    	}

    	if (currentFilter === "completed") {
        	return task.completed;
    	}

    	return true;
	});
        filteredTasks.forEach(function (task)  {
            const li = document.createElement("li");

            const taskText = document.createElement("span");
            taskText.textContent = task.text;

            if (task.completed) {
                taskText.style.textDecoration = "line-through";
            }

            const completeButton =
                document.createElement("button");
            completeButton.textContent =
                task.completed ? "Undo" : "Complete";

            completeButton.addEventListener("click", function () {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            });

            const deleteButton =
                document.createElement("button");
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", function () {
                tasks = tasks.filter(function (item) {
                    return item.id !== task.id;
                });

                saveTasks();
                renderTasks();
            });

            li.appendChild(taskText);
            li.appendChild(completeButton);
            li.appendChild(deleteButton);

            taskList.appendChild(li);
        });
    }

    // Add a new task
    addButton.addEventListener("click", function () {
        const taskText = taskInput.value.trim();

        if (taskText === "") {
            alert("Please enter a task!");
            return;
        }

        tasks.push({
            id: Date.now(),
            text: taskText,
            completed: false
        });

        saveTasks();
        renderTasks();

        taskInput.value = "";
    });

    	allButton.addEventListener("click", function () {
    	currentFilter = "all";
    	renderTasks();
	});

	activeButton.addEventListener("click", function () {
    	currentFilter = "active";
    	renderTasks();
	});

	completedButton.addEventListener("click", function () {
    	currentFilter = "completed";
    	renderTasks();
	});
    // Show saved tasks when the page opens
    renderTasks();
</script>
<script src="script.js"></script>
</body>
</html>
